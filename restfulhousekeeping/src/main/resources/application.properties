spring.application.name=restfulhousekeeping
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:testdb
server.port=50000

calendar.import.fixed-delay=PT5M
calendar.import.initial-delay=PT1M

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=3000
spring.mail.properties[mail.smtp.writetimeout]=5000

# For Testing
spring.mail.host=localhost
spring.mail.port=1025
# For Production
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=noreply@restfulhousekeeping.com
#spring.mail.password=app-password-goes-here

# Flip these to true when in production
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

spring.mail.properties.mail.debug=true